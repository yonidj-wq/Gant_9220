<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>גדוד 9220 — לוח אירועים</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>גדוד 9220</h1>
      <p class="subtitle">לוח אירועים מבצעי</p>
    </div>
  </header>

  <main>
    <!-- Legend -->
    <section class="legend-bar" id="legend-bar">
      <!-- filled by JS -->
    </section>

    <!-- Filter buttons -->
    <section class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-cat="all">הכל</button>
      <!-- filled by JS -->
    </section>

    <!-- Week view -->
    <section class="timeline" id="timeline">
      <!-- filled by JS -->
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="סגור">✕</button>
      <div class="modal-cat-badge" id="modal-cat-badge"></div>
      <h2 id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-notes" id="modal-notes"></div>
      <button class="ics-btn" id="ics-btn">📅 הוסף ליומן</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
