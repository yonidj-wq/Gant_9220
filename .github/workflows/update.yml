name: Update events from Excel

on:
  push:
    paths:
      - '**/*.xlsx'   # any Excel file anywhere in the repo

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Find and run parser
        run: |
          # Find the Excel file wherever it is
          XLSX=$(find . -name "*.xlsx" | head -1)
          echo "Found Excel: $XLSX"

          # Find parse_gantt.py wherever it is
          PARSER=$(find . -name "parse_gantt.py" | head -1)
          echo "Found parser: $PARSER"

          # Run from the directory containing the Excel
          cd "$(dirname "$XLSX")"
          python "$(realpath "$PARSER")"

      - name: Commit updated events.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: update events from Excel"
          git push
